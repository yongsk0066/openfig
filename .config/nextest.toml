# zsh-hook-tests spawns a real interactive zsh per test, each loading this build's integration
# through `q init` and timing its keystrokes against a daemon. Running several of those at once is
# enough contention to make a shell miss its startup window or a latency budget, so serialise them.
[test-groups.zsh-hook]
max-threads = 1

[[profile.default.overrides]]
filter = 'package(zsh-hook-tests)'
test-group = 'zsh-hook'
