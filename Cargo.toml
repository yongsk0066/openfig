[workspace]
resolver = "3"
members = [
  "crates/*",
  "crates/macos-utils/accessibility-master/accessibility",
  "crates/macos-utils/accessibility-master/accessibility-sys",
  "tests/fig-api/fig-api-mock",
  "tests/zsh-hook",
]
default-members = ["crates/fig_desktop", "crates/fig_cli"]

[workspace.package]
authors = ["OpenFig contributors"]
edition = "2024"
rust-version = "1.100"
homepage = ""
publish = false
version = "1.19.7"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anstream = "1.0.0"
anyhow = "1.0.104"
assert_cmd = "2.2.2"
async-trait = "0.1.92"
base64 = "0.23.1"
block2 = "0.6.2"
bytes = "1.12.1"
bitflags = { version = "2.13.2", features = ["serde"] }
camino = { version = "1.2.6", features = ["serde1"] }
clap = { version = "4.6.7", features = ["deprecated", "derive", "string", "unicode", "wrap_help"] }
color-print = "0.3.7"
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"
core-graphics = "0.25.0"
crossterm = { version = "0.29.0", features = ["event-stream", "events"] }
dashmap = "6.2.1"
dirs = "7.0.0"
eyre = "0.6.14"
fig_desktop_api = { path = "crates/fig_desktop_api" }
fig_integrations = { path = "crates/fig_integrations" }
fig_ipc = { path = "crates/fig_ipc" }
fig_log = { path = "crates/fig_log" }
fig_os_shim = { path = "crates/fig_os_shim" }
fig_proto = { path = "crates/fig_proto" }
fig_shell_ipc = { path = "crates/fig_shell_ipc" }
fig_settings = { path = "crates/fig_settings" }
fig_util = { path = "crates/fig_util" }
flume = "0.12.0"
futures = "0.3.34"
globset = "0.4.21"
hex = "0.4.3"
indoc = "2.0.8"
insta = "1.49.0"
libc = "0.2.191"
mimalloc = "0.1.52"
nix = { version = "0.32.0", features = [
  "feature",
  "fs",
  "ioctl",
  "process",
  "signal",
  "term",
  "user",
] }
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
parking_lot = "0.13.0"
percent-encoding = "2.3.2"
portable-pty = "0.9.0"
rand = "0.10.3"
regex = "1.13.1"
rusqlite = { version = "0.42.0", features = ["bundled", "serde_json", "hooks"] }
shellexpand = "3.1.2"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
spinners = "4.2.0"
strum = { version = "0.28.0", features = ["derive"] }
sysinfo = "0.40.3"
thiserror = "2.0.21"
tempfile = "3.27.0"
time = { version = "0.3.55", features = [
  "parsing",
  "formatting",
  "local-offset",
  "macros",
  "serde",
] }
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
tracing = { version = "0.1.44", features = ["log"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "parking_lot", "time"] }
url = "2.5.8"
uuid = { version = "1.29.2", features = ["v4", "serde"] }
walkdir = "2.5.0"
which = "8.0.6"
whoami = "2.1.3"

[workspace.lints.rust]
future_incompatible = "warn"
nonstandard_style = "warn"
rust_2018_idioms = "warn"

[workspace.lints.clippy]
await_holding_lock = "warn"
char_lit_as_u8 = "warn"
checked_conversions = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
# doc_markdown = "warn"
empty_enums = "warn"
enum_glob_use = "warn"
exit = "warn"
expl_impl_clone_on_copy = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
fallible_impl_from = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
float_cmp_const = "warn"
fn_params_excessive_bools = "warn"
if_let_mutex = "warn"
implicit_clone = "warn"
imprecise_flops = "warn"
inefficient_to_string = "warn"
invalid_upcast_comparisons = "warn"
large_digit_groups = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
let_unit_value = "warn"
linkedlist = "warn"
lossy_float_literal = "warn"
macro_use_imports = "warn"
manual_ok_or = "warn"
map_err_ignore = "warn"
map_flatten = "warn"
map_unwrap_or = "warn"
# match_same_arms = "warn"
match_wild_err_arm = "warn"
match_wildcard_for_single_variants = "warn"
mem_forget = "warn"
missing_enforced_import_renames = "warn"
mut_mut = "warn"
mutex_integer = "warn"
needless_borrow = "warn"
needless_continue = "warn"
needless_for_each = "warn"
option_option = "warn"
path_buf_push_overwrite = "warn"
ptr_as_ptr = "warn"
rc_mutex = "warn"
ref_option_ref = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
string_add_assign = "warn"
string_add = "warn"
string_lit_as_bytes = "warn"
todo = "warn"
trait_duplication_in_bounds = "warn"
unimplemented = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"
useless_transmute = "warn"
verbose_file_reads = "warn"
zero_sized_map_values = "warn"

[profile.release]
debug = "line-tables-only"
incremental = false
lto = "thin"

[profile.dev.package.insta]
opt-level = 3

[profile.dev.package.similar]
opt-level = 3

[profile.dev.package.backtrace]
opt-level = 3
