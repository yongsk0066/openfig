# Vendored fork of alacritty's terminal library (Apache-2.0; LICENSE is in this directory and
# attributed in the workspace NOTICE).
#
# FORK POINT: not recorded. Nothing in the tree — no vendor manifest, no upstream commit hash, no
# original `version` field (it inherits the workspace version) — says which alacritty revision this
# was taken from, and the history here starts with the code already in place. Identifying markers
# if it ever needs to be located: `SizeInfo` is still a struct on `Term` (upstream replaced it with
# `TermDimensions`/`Dimensions`), `Term::new` takes `(SizeInfo, T, u64, String)`, and there is no
# `vi_mode`, `Selection` or `Config` plumbing.
#
# WHY IT IS STILL VENDORED, and what would have to change:
#
#   * `Cell` carries an extra `fig_flags: FigFlags` field (`src/term/cell.rs:83`) marking the
#     prompt, the command text and the suggestion region. `Term::get_current_buffer` — the reason
#     figterm exists at all — is built on it, and upstream has no extension point for a per-cell
#     flag, so this cannot be reduced to "depend on the crate and wrap it".
#   * The OSC 697 sequence set (`src/ansi.rs`) and the `ShellState`/`CommandInfo` bookkeeping it
#     drives are additions to `Handler`, not configuration.
#   * `vte` is pinned to 0.15 and `Processor::advance` takes a byte slice.
#
# The only route off the fork is to promote the fig-specific parts (~740 lines) into `figterm` and
# depend on upstream `alacritty_terminal`; `Cell.fig_flags` is what blocks that.

[package]
name = "alacritty_terminal"
edition.workspace = true
version.workspace = true
publish.workspace = true
authors = [
    "Christian Duerr <contact@christianduerr.com>",
    "Joe Wilm <joe@jwilm.com>",
]
license = "Apache-2.0"
description = "Library for writing terminal emulators"
readme = "../README.md"
homepage = "https://github.com/alacritty/alacritty"

[lints]
workspace = true

[dependencies]
bitflags.workspace = true
fig_os_shim.workspace = true
serde.workspace = true
serde_yaml = "0.9"
shell_color.workspace = true
tracing.workspace = true
unicode-width.workspace = true
vte = { version = "0.15.0", default-features = false }

[dev-dependencies]
serde_json.workspace = true
