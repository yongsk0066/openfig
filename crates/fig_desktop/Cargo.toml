[package]
name = "fig_desktop"
default-run = "fig_desktop"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
publish.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
# console = ["tokio/tracing", "fig_log/console"]

[dependencies]
accessibility-sys = { path = "../macos-utils/accessibility-master/accessibility-sys", version = "0.1.3" }
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
camino.workspace = true
clap.workspace = true
core-graphics.workspace = true
dashmap.workspace = true
fig_desktop_api.workspace = true
fig_integrations.workspace = true
fig_ipc.workspace = true
fig_log.workspace = true
fig_os_shim.workspace = true
fig_proto.workspace = true
fig_shell_ipc.workspace = true
fig_settings.workspace = true
fig_util.workspace = true
flume.workspace = true
fnv = "1.0.7"
image = { version = "0.25.10", default-features = false, features = ["png"] }
infer = "0.22.0"
libc.workspace = true
macos-utils = { path = "../macos-utils" }
mime = "0.3.18"
muda = { version = "0.21.2", default-features = false }
nix.workspace = true
notify = "8.2.2"
objc2.workspace = true
block2.workspace = true
objc2-app-kit = { workspace = true, features = ["block2", "NSApplication", "NSEvent", "NSView", "NSWindow", "NSWorkspace", "NSRunningApplication"] }
objc2-foundation.workspace = true
parking_lot = { workspace = true, features = ["serde"] }
