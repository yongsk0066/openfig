[package]
name = "fig_proto"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
publish.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
arbitrary = { version = "1.5.0", optional = true, features = ["derive"] }
bytes.workspace = true
fig_util.workspace = true
hex.workspace = true
prost = "0.14.6"
prost-reflect = { version = "0.16.5", features = ["serde", "derive"] }
rmp-serde = "1.3.1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[build-dependencies]
prost-build = "0.14.6"
prost-reflect-build = "0.16.1"

[package.metadata.cargo-machete]
# build.rs drives prost-build/prost-reflect-build and injects the arbitrary derive.
ignored = ["arbitrary", "prost-build", "prost-reflect-build"]
