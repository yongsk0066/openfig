    "NSWorkspace",
    "NSRunningApplication",
    "libc",
] }
objc2-foundation = { workspace = true, features = [
    "block2",
    "NSDictionary",
    "NSDistributedNotificationCenter",
    "NSEnumerator",
    "NSOperation",
    "NSProcessInfo",
    "NSURL",
] }
flume.workspace = true
