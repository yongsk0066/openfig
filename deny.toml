[graph]
targets = ["aarch64-apple-darwin"]

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"

ignore = [
  # paste 1.0.15 is unmaintained but has no replacement and no known defect;
  # fig_desktop, fig_util and alacritty_terminal all use it directly.
  "RUSTSEC-2024-0436",
]

[licenses]
version = 2
private = { ignore = true }
# Permissive licences only; anything not listed here is denied.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[bans.workspace-dependencies]
duplicates = "allow"
include-path-dependencies = true
unused = "deny"

[[bans.deny]]
name = "openssl"

[[bans.deny]]
name = "git2"

[[bans.deny]]
name = "tempdir"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
