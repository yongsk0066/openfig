packages:
  - proto
  - specs
  - tests/fig-api
  - packages/*

# pnpm 12 refuses to run dependency build scripts unless decided here.
# buf downloads its CLI binary in postinstall; the other two are not needed at
# build time. esbuild's postinstall only swaps its `bin/esbuild` shim for the
# native binary, and the spec compiler drives esbuild through its Node API,
# which finds @esbuild/darwin-arm64 on its own.
allowBuilds:
  "@bufbuild/buf": true
  core-js: false
  esbuild: false

# Transitive dev-only advisories (`pnpm audit`): ts-morph's minimatch chain and
# vite's yaml. Both are same-major patch bumps; minimatch >=10.2.6 also pulls a
# patched brace-expansion.
overrides:
  minimatch: ^10.2.6
  yaml: ^2.9.0

# Refuse versions published less than a day ago; the window in which a
# compromised release is usually caught and unpublished.
minimumReleaseAge: 1440

# `pnpm add` records new versions in the catalog instead of scattering them
# across package.json files.
catalogMode: strict

# Single versions for shared tooling; packages reference them as "catalog:".
catalog:
  "typescript": 7.0.2
  "vite": 8.2.2
  "@vitejs/plugin-react": 6.1.1
  "vitest": 5.0.0
  "@vitest/coverage-v8": 5.0.0
  "@vitest/ui": 5.0.0
  "@types/node": 26.5.1
  "jsdom": 30.0.1
  "turbo": 2.10.12
  "ts-morph": 28.0.0
  "@bufbuild/protobuf": 2.14.1
  "@bufbuild/buf": 1.72.0
  "@bufbuild/protoc-gen-es": 2.14.1
  "tailwindcss": 4.3.3
  "@tailwindcss/vite": 4.3.3
  esbuild: 0.28.2
  "oxlint": 1.82.0
  "oxlint-tsgolint": 7.0.2001
  "oxfmt": 0.67.0
  react: 19.3.0
  react-dom: 19.3.0
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  zustand: 5.0.15
  zod: 4.6.1

minimumReleaseAgeExclude:
  - "@types/node@26.5.1"
  - "@types/react-dom@19.3.0"
  - "@types/react@19.3.0"
  - lucide-react@1.44.0
  - react-dom@19.3.0
  - react@19.3.0
  - scheduler@0.28.0
  - zod@4.6.1
