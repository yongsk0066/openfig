packages:
  - proto
  - tests/fig-api
  - packages/*

# pnpm 12 refuses to run dependency build scripts unless decided here.
# buf downloads its CLI binary in postinstall; the other two are not needed at build time.
allowBuilds:
  "@bufbuild/buf": true
  core-js: false
  esbuild: false

# Single versions for shared tooling; packages reference them as "catalog:".
catalog:
  "typescript": 7.0.2
  "vite": 8.2.2
  "@vitejs/plugin-react": 6.1.1
  "vitest": 5.0.0
  "@vitest/coverage-v8": 5.0.0
  "@vitest/ui": 5.0.0
  "@types/node": 26.5.1
  "jsdom": 30.0.1
  "turbo": 2.10.12
  "ts-morph": 28.0.0
  "@bufbuild/protobuf": 2.14.1
  "@bufbuild/buf": 1.72.0
  "@bufbuild/protoc-gen-es": 2.14.1
  "tailwindcss": 4.3.3
  "@tailwindcss/vite": 4.3.3
  "@withfig/autocomplete-types": 1.31.0
  "oxlint": 1.82.0
  "oxfmt": 0.67.0
  react: 19.3.0
  react-dom: 19.3.0
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  zustand: 5.0.15
  zod: 4.6.1

minimumReleaseAgeExclude:
  - "@types/node@26.5.1"
  - "@types/react-dom@19.3.0"
  - "@types/react@19.3.0"
  - lucide-react@1.44.0
  - react-dom@19.3.0
  - react@19.3.0
  - scheduler@0.28.0
  - zod@4.6.1
