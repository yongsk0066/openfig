syntax = "proto3";
package remote;

import "fig.proto";
import "fig_common.proto";
import "figterm.proto";
import "local.proto";

// all endpoints defined in this file are available to remote servers
// be careful and keep security in mind
//
// The pty binary and the desktop app are built together but not always run
// together: a `<shell> (figterm)` copy in a terminal tab that was opened before
// a rebuild keeps talking to the new desktop. The handshake carries
// `fig_proto::remote::PROTOCOL_VERSION`, and the desktop refuses a peer whose
// version differs. Bump that constant with any change to this file, or to a
// message it carries, that an older peer would misread.

message RunProcessRequest {
  string executable = 1;
  repeated string arguments = 2;
  optional string working_directory = 3;
  repeated fig_common.EnvironmentVariable env = 4;
  optional fig_common.Duration timeout = 5;
}

message Clientbound {
  reserved 103;

  oneof packet {
    HandshakeResponse handshake_response = 100;
    fig_common.Empty ping = 101;
    Request request = 102;
  }

  message HandshakeResponse {
    bool success = 1;
    // Why `success` is false. Unspecified on success and from desktops that
    // predate the field.
    RejectReason reject_reason = 2;
    // `PROTOCOL_VERSION` of the desktop that answered; 0 from desktops that
    // predate the field.
    uint32 protocol_version = 3;

    enum RejectReason {
      REJECT_REASON_UNSPECIFIED = 0;
      // `Handshake.protocol_version` is not the desktop's. The pty binary
      // stops connecting and runs the shell without hooks.
      REJECT_REASON_PROTOCOL_VERSION_MISMATCH = 1;
    }
  }

  message Request {
    reserved 102, 103, 105;

    optional uint64 nonce = 1;

    oneof request {
      figterm.InterceptRequest intercept = 100;
      figterm.InsertTextRequest insert_text = 101;

      RunProcessRequest run_process = 104;
    }
  }
}

message Hostbound {
  oneof packet {
    Handshake handshake = 100;
    Request request = 101;
    Response response = 102;
    fig_common.Empty pong = 103;
  }

  message Handshake {
    // 2 was `secret`, 3 was `optional string parent_id`.
    reserved 2, 3;

    string id = 1;
    // `fig_proto::remote::PROTOCOL_VERSION` of the pty binary; 0 from builds
    // that predate the field.
    uint32 protocol_version = 4;
  }

  message Request {
    optional uint64 nonce = 1;

    oneof request {
      local.EditBufferHook edit_buffer = 101;
      local.PromptHook prompt = 102;
      local.PreExecHook pre_exec = 103;
      local.PostExecHook post_exec = 108;
      local.InterceptedKeyHook intercepted_key = 104;
    }
  }

  message Response {
    reserved 101, 103;

    optional uint64 nonce = 1;

    oneof response {
      string error = 100;

      fig.RunProcessResponse run_process = 102;
    }
  }
}
